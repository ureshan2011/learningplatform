<!-- @dsCard group="Brand" viewport="700x180" name="Two worlds" subtitle="Cream marketing surfaces vs near-black product surfaces, one palette" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.t{color:var(--text-muted);font:var(--type-mono);font-size:10px}</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;background:var(--paper-100);border-radius:var(--radius-panel);padding:20px">
<div class="ict-eyebrow">Marketing</div>
<div style="font:var(--type-h2);color:var(--text-strong);letter-spacing:-0.02em;margin:6px 0 12px">Cream world<span style="color:var(--text-brand)">.</span></div>
<div style="background:var(--paper-0);box-shadow:var(--shadow-sm);border-radius:var(--radius-card);height:44px"></div>
</div>
<div style="flex:1;background:var(--ink-900);border-radius:var(--radius-panel);padding:20px">
<div class="ict-eyebrow" style="color:var(--orange-400)">Product</div>
<div style="font:var(--type-h2);color:var(--text-on-dark);letter-spacing:-0.02em;margin:6px 0 12px">Dark world<span style="color:var(--orange-400)">.</span></div>
<div style="background:var(--ink-850);border:1px solid var(--border-dark);border-radius:var(--radius-card);height:44px"></div>
</div>
<div style="flex:0 0 150px;background:var(--cocoa-700);border-radius:var(--radius-panel);padding:20px;color:var(--text-on-dark)">
<div style="font:var(--type-label);color:var(--orange-300)">Cocoa</div>
<p style="font:var(--type-body-sm);color:var(--text-on-dark-muted);margin-top:6px">One feature banner per screen</p>
</div>
</div></body></html>
