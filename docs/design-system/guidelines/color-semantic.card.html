<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status hues" subtitle="Only ever 6px dots, thin badges and tiny labels — never large fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:grid;gap:10px}.sw{display:flex;gap:8px}.c{flex:1;border-radius:var(--radius-md);height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:var(--type-mono);font-size:10px}.n{font:var(--type-label);font-size:11px;color:var(--text-strong);margin-top:6px}</style></head><body><div class="sw"><div><div class="c" style="background:var(--green-500);color:var(--ink-600)"></div><div class="n">success</div></div><div><div class="c" style="background:var(--amber-500);color:var(--ink-600)"></div><div class="n">warning</div></div><div><div class="c" style="background:var(--red-500);color:var(--ink-600)"></div><div class="n">danger</div></div><div><div class="c" style="background:var(--blue-500);color:var(--ink-600)"></div><div class="n">info</div></div><div><div class="c" style="background:var(--violet-500);color:var(--ink-600)"></div><div class="n">event</div></div><div><div class="c" style="background:var(--green-50);color:var(--ink-600)"></div><div class="n">success bg</div></div><div><div class="c" style="background:var(--amber-50);color:var(--ink-600)"></div><div class="n">warning bg</div></div><div><div class="c" style="background:var(--red-50);color:var(--ink-600)"></div><div class="n">danger bg</div></div></div></body></html>
