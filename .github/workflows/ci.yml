name: CI

# App Hosting builds and deploys on every push to the live branch, so a broken
# commit becomes a broken deploy. This catches it on the pull request first.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # No secrets needed: server env vars are read lazily through
      # requireServerEnv, so the build succeeds without them and only fails at
      # runtime if something is genuinely missing.
      - run: npm run build
