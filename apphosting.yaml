# Firebase App Hosting configuration.
#
# Nothing to fill in for your first deploy. App Hosting injects your Firebase
# config automatically (see next.config.ts), and every other service is optional
# until you turn it on.
#
# To add a service later, ask in chat — or uncomment its block below.

runConfig:
  # Deliberately capped. App Hosting is pay-as-you-go past the free tier, and an
  # unbounded maxInstances is how a bad query becomes a shocking bill. Raise it
  # once you know your real cost per student per class.
  maxInstances: 5
  # Free, at the cost of a few seconds on the first request to a cold backend.
  # Raise to 1 shortly before a big class so 500 students are not all waiting on
  # a cold start at once.
  minInstances: 0
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Realtime Database, Singapore. Set explicitly because it cannot be derived:
  # only us-central1 databases use `<name>.firebaseio.com`; every other region
  # uses `<name>.<region>.firebasedatabase.app`. A wrong host fails silently.
  # Verified reachable and in locked mode (a root read returns 401).
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://srizone-1fc76-default-rtdb.asia-southeast1.firebasedatabase.app
    availability: [BUILD, RUNTIME]

# ---------------------------------------------------------------------------
# LATER: your public site address.
#
# Needed only once card payments or the Zoom simulcast are on — PayHere's
